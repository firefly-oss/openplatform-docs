# Build OpenPlatform docs and run Firefly brand check on every push/PR.
name: Docs

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-brand-check:
    name: mkdocs build --strict + brand_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: MkDocs build (strict)
        run: mkdocs build --strict

      - name: Brand check
        run: |
          mapfile -t md < <(find docs -name '*.md' | sort)
          python3 scripts/brand_check.py README.md "${md[@]}"
