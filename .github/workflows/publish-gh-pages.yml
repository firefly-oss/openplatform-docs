# Publish stub for GitHub Pages. Does not configure DNS for
# docs.fireflysoftware.io — enable Pages (gh-pages branch or Actions) in
# repository settings when the team is ready, then switch workflow_dispatch
# to a push trigger if desired.
#
# Prefer mike for versioned docs on gh-pages (aliases 26.10.19 / latest):
#
#   mkdocs build --strict
#   mike deploy --push --update-aliases 26.10.19 latest
#   mike set-default --push latest
#
# This workflow still publishes a single unversioned site/ tree via
# peaceiris/actions-gh-pages so a first snapshot can be reviewed without
# committing to mike. When ready for the public train, replace the
# "Deploy to gh-pages" step with mike (checkout with fetch-depth: 0,
# configure git user, then mike deploy / set-default). See
# docs/versioning/mike.md. Keep workflow_dispatch-only until publish is
# approved.
name: Publish (GitHub Pages stub)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish to build and push the site/ tree to gh-pages"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push gh-pages
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'publish'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # For a future mike-based deploy, use fetch-depth: 0 so mike can
        # read full history and update the gh-pages branch safely.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: MkDocs build (strict)
        run: mkdocs build --strict

      - name: Brand check
        run: |
          mapfile -t md < <(find docs -name '*.md' | sort)
          python3 scripts/brand_check.py README.md "${md[@]}"

      # Snapshot deploy (unversioned). Replace with mike when versioned
      # Pages are approved, for example:
      #   git config user.name "github-actions[bot]"
      #   git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      #   mike deploy --push --update-aliases 26.10.19 latest
      #   mike set-default --push latest
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          cname: docs.fireflysoftware.io
