<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 510" width="728" height="510" role="img">
<style>text{font-family:Manrope,system-ui,sans-serif;fill:#10110f}.box{fill:#fff;stroke:#10110f;stroke-width:1.5}.life{stroke:#c8c4ba;stroke-width:1.4}.arr{stroke:#855414;stroke-width:1.8;fill:none}.dash{stroke:#62645b;stroke-width:1.8;fill:none;stroke-dasharray:7 4}.name{font-size:15px;font-weight:700}.lab{font-size:14px}</style>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#855414"/></marker>
<marker id="dh" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#62645b"/></marker></defs>
<rect class="box" x="24" y="16" width="150" height="52" rx="3"/>
<text class="name" x="99.0" y="47.0" text-anchor="middle">Ada</text>
<line class="life" x1="99.0" y1="68" x2="99.0" y2="500"/>
<rect class="box" x="194" y="16" width="150" height="52" rx="3"/>
<text class="name" x="269.0" y="47.0" text-anchor="middle">Cards</text>
<line class="life" x1="269.0" y1="68" x2="269.0" y2="500"/>
<rect class="box" x="364" y="16" width="150" height="52" rx="3"/>
<text class="name" x="439.0" y="47.0" text-anchor="middle">Access</text>
<line class="life" x1="439.0" y1="68" x2="439.0" y2="500"/>
<rect class="box" x="534" y="16" width="150" height="52" rx="3"/>
<text class="name" x="609.0" y="47.0" text-anchor="middle">Card record</text>
<line class="life" x1="609.0" y1="68" x2="609.0" y2="500"/>
<text class="lab" x="107.0" y="108">Issue a card on her account, name Ada</text>
<text class="lab" x="107.0" y="126">Lovelace</text>
<line class="arr" x1="101.0" y1="134" x2="257.0" y2="134" marker-end="url(#ah)"/>
<text class="lab" x="277.0" y="172">May she create a card?</text>
<line class="arr" x1="271.0" y1="180" x2="427.0" y2="180" marker-end="url(#ah)"/>
<text class="lab" x="277.0" y="218">If access is refused, no card is stored</text>
<line class="dash" x1="437.0" y1="226" x2="281.0" y2="226" marker-end="url(#dh)"/>
<text class="lab" x="277.0" y="264">Store the card on the cards record</text>
<line class="arr" x1="271.0" y1="272" x2="597.0" y2="272" marker-end="url(#ah)"/>
<text class="lab" x="107.0" y="310">She receives the card id. Status</text>
<text class="lab" x="107.0" y="328">completed.</text>
<line class="arr" x1="607.0" y1="336" x2="111.0" y2="336" marker-end="url(#ah)"/>
<text class="lab" x="107.0" y="374">Activate, then she can block or cancel</text>
<line class="arr" x1="101.0" y1="382" x2="257.0" y2="382" marker-end="url(#ah)"/>
<text class="lab" x="277.0" y="420">Each later step checks access again</text>
<line class="arr" x1="271.0" y1="428" x2="427.0" y2="428" marker-end="url(#ah)"/>
<text class="lab" x="447.0" y="466">Block or cancel updates the same card</text>
<line class="arr" x1="441.0" y1="474" x2="597.0" y2="474" marker-end="url(#ah)"/>
</svg>