<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 564" width="896" height="564" role="img">
<style>
text { font-family: Manrope, system-ui, sans-serif; fill: #10110f; }
.box { fill: #ffffff; stroke: #10110f; stroke-width: 1.5; }
.life { stroke: #c8c4ba; stroke-width: 1.4; }
.arr { stroke: #855414; stroke-width: 1.8; fill: none; }
.dash { stroke: #62645b; stroke-width: 1.8; fill: none; stroke-dasharray: 7 4; }
.name { font-size: 15px; font-weight: 700; }
.lab { font-size: 14px; }
</style>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#855414"/></marker>
<marker id="dh" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#62645b"/></marker>
</defs>
<rect class="box" x="28" y="18" width="148" height="52" rx="3"/>
<text class="name" x="102.0" y="49.0" text-anchor="middle">Ada</text>
<line class="life" x1="102.0" y1="70" x2="102.0" y2="552"/>
<rect class="box" x="196" y="18" width="148" height="52" rx="3"/>
<text class="name" x="270.0" y="49.0" text-anchor="middle">Profile</text>
<line class="life" x1="270.0" y1="70" x2="270.0" y2="552"/>
<rect class="box" x="364" y="18" width="148" height="52" rx="3"/>
<text class="name" x="438.0" y="49.0" text-anchor="middle">Access</text>
<line class="life" x1="438.0" y1="70" x2="438.0" y2="552"/>
<rect class="box" x="532" y="18" width="148" height="52" rx="3"/>
<text class="name" x="606.0" y="49.0" text-anchor="middle">Person record</text>
<line class="life" x1="606.0" y1="70" x2="606.0" y2="552"/>
<rect class="box" x="700" y="18" width="148" height="52" rx="3"/>
<text class="name" x="774.0" y="49.0" text-anchor="middle">Agreements</text>
<line class="life" x1="774.0" y1="70" x2="774.0" y2="552"/>
<text class="lab" x="112.0" y="112">Open her profile</text>
<line class="arr" x1="104.0" y1="120" x2="258.0" y2="120" marker-end="url(#ah)"/>
<text class="lab" x="280.0" y="160">May the sample customer read this party?</text>
<line class="arr" x1="272.0" y1="168" x2="426.0" y2="168" marker-end="url(#ah)"/>
<text class="lab" x="280.0" y="208">If access is refused, return nothing</text>
<line class="arr" x1="436.0" y1="216" x2="282.0" y2="216" marker-end="url(#ah)"/>
<text class="lab" x="280.0" y="256">Read her name, contacts, and consents</text>
<line class="arr" x1="272.0" y1="264" x2="594.0" y2="264" marker-end="url(#ah)"/>
<text class="lab" x="112.0" y="304">Ask which agreements she holds</text>
<line class="arr" x1="104.0" y1="312" x2="258.0" y2="312" marker-end="url(#ah)"/>
<text class="lab" x="280.0" y="352">List each agreement and the product on it</text>
<line class="arr" x1="272.0" y1="360" x2="762.0" y2="360" marker-end="url(#ah)"/>
<text class="lab" x="112.0" y="400">Number, status, product name, and product code</text>
<line class="arr" x1="772.0" y1="408" x2="114.0" y2="408" marker-end="url(#ah)"/>
<text class="lab" x="112.0" y="448">Change a name or an address</text>
<line class="arr" x1="104.0" y1="456" x2="258.0" y2="456" marker-end="url(#ah)"/>
<text class="lab" x="280.0" y="496">If the change fails, write the previous row</text>
<text class="lab" x="280.0" y="514">back</text>
<line class="dash" x1="604.0" y1="522" x2="282.0" y2="522" marker-end="url(#dh)"/>
</svg>