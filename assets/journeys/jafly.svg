<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 456" width="728" height="456" role="img">
<style>
text { font-family: Manrope, system-ui, sans-serif; fill: #10110f; }
.box { fill: #ffffff; stroke: #10110f; stroke-width: 1.5; }
.life { stroke: #c8c4ba; stroke-width: 1.4; }
.arr { stroke: #855414; stroke-width: 1.8; fill: none; }
.dash { stroke: #62645b; stroke-width: 1.8; fill: none; stroke-dasharray: 7 4; }
.name { font-size: 15px; font-weight: 700; }
.lab { font-size: 14px; }
</style>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#855414"/></marker>
<marker id="dh" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#62645b"/></marker>
</defs>
<rect class="box" x="28" y="18" width="148" height="52" rx="3"/>
<text class="name" x="102.0" y="49.0" text-anchor="middle">Journey</text>
<line class="life" x1="102.0" y1="70" x2="102.0" y2="444"/>
<rect class="box" x="196" y="18" width="148" height="52" rx="3"/>
<text class="name" x="270.0" y="49.0" text-anchor="middle">Decision</text>
<line class="life" x1="270.0" y1="70" x2="270.0" y2="444"/>
<rect class="box" x="364" y="18" width="148" height="52" rx="3"/>
<text class="name" x="438.0" y="49.0" text-anchor="middle">Rules</text>
<line class="life" x1="438.0" y1="70" x2="438.0" y2="444"/>
<rect class="box" x="532" y="18" width="148" height="52" rx="3"/>
<text class="name" x="606.0" y="49.0" text-anchor="middle">Outcome</text>
<line class="life" x1="606.0" y1="70" x2="606.0" y2="444"/>
<text class="lab" x="112.0" y="112">Ask for a decision and omit the score</text>
<line class="arr" x1="104.0" y1="120" x2="258.0" y2="120" marker-end="url(#ah)"/>
<text class="lab" x="280.0" y="160">The sandbox report supplies 640 and not high</text>
<text class="lab" x="280.0" y="178">risk</text>
<line class="arr" x1="272.0" y1="186" x2="426.0" y2="186" marker-end="url(#ah)"/>
<text class="lab" x="280.0" y="226">640 is below 680, so the outcome is refer</text>
<line class="arr" x1="436.0" y1="234" x2="282.0" y2="234" marker-end="url(#ah)"/>
<text class="lab" x="112.0" y="274">The journey continues. High risk would decline</text>
<text class="lab" x="112.0" y="292">and stop.</text>
<line class="arr" x1="268.0" y1="300" x2="114.0" y2="300" marker-end="url(#ah)"/>
<text class="lab" x="112.0" y="340">Sign in as sample-journey</text>
<line class="arr" x1="104.0" y1="348" x2="258.0" y2="348" marker-end="url(#ah)"/>
<text class="lab" x="112.0" y="388">Sandbox identity returns Ada and does not</text>
<text class="lab" x="112.0" y="406">start a provider</text>
<line class="arr" x1="268.0" y1="414" x2="114.0" y2="414" marker-end="url(#ah)"/>
</svg>