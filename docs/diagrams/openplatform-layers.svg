<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="653" viewBox="0 0 960 653" role="img" aria-labelledby="title desc">
<title id="title">OpenPlatform layers</title>
<desc id="desc">Experience services call domain services. Domain services call core services. Adapters are a separate boundary.</desc>
<style>text { font-family: Manrope, Arial, Helvetica, sans-serif; }</style>
<rect width="960" height="653" fill="#F3F1EB"/>
<rect x="0" y="0" width="960" height="653" fill="#F3F1EB"/>
<text x="56" y="76.1" fill="#10110F" font-size="36" font-weight="700">OpenPlatform layers</text>
<text x="56" y="117.3" fill="#62645B" font-size="22" font-weight="400">One direction. Experience calls domain. Domain calls core.</text>
<rect x="40" y="151.5" width="880" height="103.2" rx="16" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="1.5"/>
<rect x="40" y="169.5" width="8" height="67.2" fill="#FFB34A"/>
<text x="68" y="192.4" fill="#10110F" font-size="32" font-weight="700">Experience</text>
<text x="68" y="232.6" fill="#272820" font-size="22" font-weight="400">Channel and journey APIs. A portal calls this band for one task.</text>
<line x1="480" y1="262.7" x2="480" y2="308.7" stroke="#474A42" stroke-width="2"/>
<polygon points="472,306.7 488,306.7 480,318.7" fill="#474A42"/>
<rect x="40" y="326.7" width="880" height="103.2" rx="16" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="1.5"/>
<rect x="40" y="344.7" width="8" height="67.2" fill="#474A42"/>
<text x="68" y="367.7" fill="#10110F" font-size="32" font-weight="700">Domain</text>
<text x="68" y="407.8" fill="#272820" font-size="22" font-weight="400">Commands, queries, and process coordination for one bounded context.</text>
<line x1="480" y1="438" x2="480" y2="484" stroke="#474A42" stroke-width="2"/>
<polygon points="472,482 488,482 480,494" fill="#474A42"/>
<rect x="40" y="502" width="880" height="103.2" rx="16" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="1.5"/>
<rect x="40" y="520" width="8" height="67.2" fill="#474A42"/>
<text x="68" y="542.9" fill="#10110F" font-size="32" font-weight="700">Core</text>
<text x="68" y="583" fill="#272820" font-size="22" font-weight="400">Persistence and the service APIs that hold the record.</text>
</svg>
