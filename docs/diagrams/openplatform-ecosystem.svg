<text x="64" y="485.3" fill="#10110F" font-size="26" font-weight="700">distribution</text>
<text x="64" y="518.6" fill="#62645B" font-size="18" font-weight="400">Partner access, branding, territories</text>
<rect x="490" y="437" width="430" height="132" rx="14" fill="#FFFFFF" stroke="#D8D4CA" stroke-width="1.5"/>
<text x="514" y="485.3" fill="#10110F" font-size="26" font-weight="700">accounts</text>
<text x="514" y="518.6" fill="#62645B" font-size="18" font-weight="400">Relationships, ledger, and general ledger</text>
