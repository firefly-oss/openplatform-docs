<text x="514" y="822.6" fill="#62645B" font-size="18" font-weight="400">Identity, notifications, reference data</text>
<text x="48" y="915" fill="#62645B" font-size="18" font-weight="400">Insurance areas reuse these modules. No dedicated insurance repository is published.</text>
