<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">OpenPlatform in firefly-oss</title>
<desc id="desc">OpenPlatform modules live in firefly-oss on the Jafly train. Commercial products in firefly-serviceOS may compose those modules. Institution systems connect through adapters.</desc>
