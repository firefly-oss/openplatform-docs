<text x="48" y="69" fill="#10110F" font-size="32" font-weight="700">firefly-oss module map</text>
<text x="48" y="104" fill="#62645B" font-size="18" font-weight="400">Each card is one module id. Repository names sit on that module&#x27;s page.</text>
