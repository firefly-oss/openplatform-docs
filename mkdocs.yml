# Firefly OpenPlatform developer documentation hub.
# Theme pack: vendored from fireflysoftwaresolutions/brand-kit dist/Firefly-Brand-Kit/16-MkDocs/

# The product name matches the branded header; Firefly appears in the logo lockup.
site_name: OpenPlatform
site_description: Business journeys, architecture, integrations, and operating guides for the Firefly banking and insurance platform.
site_author: Firefly Software Foundation
site_url: https://docs.fireflysoftware.io/
repo_url: https://github.com/fireflysoftwaresolutions/openplatform-docs
repo_name: fireflysoftwaresolutions/openplatform-docs
edit_uri: edit/main/docs/
copyright: Copyright 2026 Firefly Software Foundation & Firefly Software Solutions Inc
strict: true
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  logo: assets/brand/firefly-logo-compact-reversed.svg
  favicon: assets/brand/favicon.svg
  custom_dir: theme/overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - mike:
      # Version selector aliases (e.g. 26.10.19 / latest) are created with
      # `mike deploy` — see docs/versioning/mike.md. Canonical alias for
      # the public train:
      canonical_version: latest

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/firefly-docs.css

extra_javascript:
  - javascripts/nav.js

hooks:
  - hooks/swagger_ui.py
  - hooks/repository_links.py

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

extra:
  # mike version selector stays off until `mike deploy` publishes versions.json
  # (flat gh-pages snapshot today). Re-enable with:
  #   version:
  #     provider: mike
  #     default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fireflysoftwaresolutions
  firefly:
    brand: Firefly
    products:
      - OpenPlatform
    slogan: Attitude makes the difference.

