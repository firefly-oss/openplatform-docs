# Firefly OpenPlatform developer documentation hub.
# Theme pack: vendored from firefly-oss/brand-kit dist/Firefly-Brand-Kit/16-MkDocs/

# site_name is the document title. The navbar lockup stays logo | OpenPlatform
# (see overrides/partials/header.html). Do not shorten this to OpenPlatform.
site_name: Firefly OpenPlatform Documentation
site_description: Open-source corporate systems for banking and insurance. Firefly OpenPlatform, version 26.10.3.
site_author: Firefly Software Foundation
site_url: https://docs.fireflysoftware.io/
repo_url: https://github.com/fireflysoftwaresolutions/openplatform-docs
repo_name: fireflysoftwaresolutions/openplatform-docs
edit_uri: edit/main/docs/
copyright: Copyright 2026 Firefly Software Foundation & Firefly Software Solutions Inc
strict: true
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  logo: assets/brand/firefly-logo-compact-reversed.svg
  favicon: assets/brand/favicon.svg
  custom_dir: theme/overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - mike:
      # Version selector aliases (e.g. 26.10.19 / latest) are created with
      # `mike deploy` — see docs/versioning/mike.md. Canonical alias for
      # the public train:
      canonical_version: latest

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/firefly-docs.css

extra:
  # mike version selector stays off until `mike deploy` publishes versions.json
  # (flat gh-pages snapshot today). Re-enable with:
  #   version:
  #     provider: mike
  #     default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fireflysoftwaresolutions
  firefly:
    brand: Firefly
    products:
      - OpenPlatform
    slogan: Attitude makes the difference.

nav:
  - Presentation: index.md
  - Start here: quickstart.md
  - Jafly: jafly.md
  - Architecture:
      - layers/index.md
      - Domain: layers/domain.md
      - Core: layers/core.md
      - Libraries: layers/libraries.md
      - Replace an adapter: adapters/index.md
      - Version: release/train.md
  - Banking:
      - Journeys: experience/index.md
      - Open and close an account: experience/public/accounts.md
      - Cards: experience/public/cards.md
      - Lending: experience/public/lending.md
      - Administration:
          - Finance terminal: experience/administration/finance.md
      - Accounts and cards: catalog/banking.md
      - Lending catalog: catalog/lending.md
  - Insurance:
      - Journey: experience/public/insurance.md
      - Administration:
          - Insurance terminal: experience/administration/insurance.md
      - Insurance catalog: catalog/insurance.md
  - Shared:
      - Onboarding: experience/public/onboarding.md
      - Profile: experience/public/profile.md
      - Customer:
          - Bounded context: domains/customer/context.md
          - Journeys: domains/customer/journeys.md
          - Domain: domains/customer/domain.md
          - Core: domains/customer/core.md
      - Contract:
          - Bounded context: domains/contract/context.md
          - Journeys: domains/contract/journeys.md
          - Domain: domains/contract/domain.md
          - Core: domains/contract/core.md
      - Product:
          - Bounded context: domains/product/context.md
          - Journeys: domains/product/journeys.md
          - Domain: domains/product/domain.md
          - Core: domains/product/core.md
      - Models:
          - models/index.md
          - Party: models/party.md
          - Contract: models/contract.md
          - Product: models/product.md
      - Security and access: catalog/security.md
      - Decision: catalog/decision.md
      - Data and external systems: catalog/data.md
      - Shared platform: catalog/shared.md
  - API:
      - api/index.md
      - Onboarding: api/onboarding.md
      - Profile: api/profile.md
      - Accounts: api/accounts.md
      - Cards: api/cards.md
      - Lending: api/lending.md
      - Insurance: api/insurance.md
      - Distributor: api/distributor.md
      - Notifications: api/notifications.md
      - Security: api/security.md
      - Channel: api/channel.md
  - Catalog:
      - catalog/index.md
      - Customer and party: catalog/customer.md
      - Contract: catalog/contract.md
      - Product: catalog/product.md
      - Onboarding and other journeys: catalog/journeys.md
      - Edit these docs: release/edit.md
